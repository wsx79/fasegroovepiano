name: Move tags

# Points every tag listed in .github/retag.txt ("tag commit" per line) to its commit.
# Actions -> Move tags -> Run workflow. (A push from this workflow doesn't start other builds.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the tags
        run: |
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            git push --force origin "$sha:refs/tags/$tag"
          done < .github/retag.txt

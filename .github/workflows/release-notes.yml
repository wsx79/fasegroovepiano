name: Update release notes

# Rewrites the text of an existing GitHub Release from CHANGELOG.md, without rebuilding.
# Actions -> Update release notes -> Run workflow -> tag (e.g. v1.1.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: .github/scripts/release-notes.sh "${{ inputs.tag }}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Fase Groove Piano ${{ inputs.tag }}
          body_path: release-notes.md

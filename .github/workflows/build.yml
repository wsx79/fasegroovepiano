name: Build

# Builds run only where they matter, to save GitHub Actions minutes:
# pushes to main (not for docs-only changes), pull requests, version tags,
# and manual runs (Actions -> Build -> Run workflow, optionally publishing a release).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to publish as a GitHub Release (e.g. v1.0.0). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package: FaseGroovePiano-Windows
          - name: macOS
            os: macos-latest
            package: FaseGroovePiano-macOS
          - name: Linux
            os: ubuntu-latest
            package: FaseGroovePiano-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libxcomposite-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in build/FaseGroovePiano_artefacts/Release/VST3/*.vst3 \
                   build/FaseGroovePiano_artefacts/Release/AU/*.component \
                   build/FaseGroovePiano_artefacts/Release/Standalone/*.app; do
            codesign --force --deep --sign - "$f"
          done

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/FaseGroovePiano_artefacts/Release
          for dir in VST3 AU Standalone; do
            [ -d "$dir" ] && cp -R "$dir" "$GITHUB_WORKSPACE/dist/"
          done
          cd "$GITHUB_WORKSPACE"
          cp README.md CHANGELOG.md LICENSE PRIVACY.md THIRD_PARTY_NOTICES.md dist/
          cp docs/GUIDA.md dist/GUIDA.md
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${{ matrix.package }}.zip" ./dist/*
          else
            (cd dist && zip -qry "../${{ matrix.package }}.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: .github/scripts/release-notes.sh "${{ inputs.release_tag || github.ref_name }}" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fase Groove Piano ${{ inputs.release_tag || github.ref_name }}
          files: packages/*.zip
          body_path: release-notes.md
